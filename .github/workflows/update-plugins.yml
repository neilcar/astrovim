# Weekly plugin updates, tested before anyone sees them: update every plugin (Lazy update) on a clean
# machine, run the startup check on Linux and macOS with the new versions, and only if both pass open a
# pull request with the new lazy-lock.json and the list of plugins that moved. Merging it is a normal
# push to main, so it goes through check.yml again before stable (and the machines) get it.
name: update plugins

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: update the lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nvim-config
      - name: Install Neovim, the tree-sitter CLI and luarocks
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          npm install -g tree-sitter-cli
          sudo apt-get update -q && sudo apt-get install -y -q luarocks lua5.1 liblua5.1-0-dev
      - name: Update every plugin
        timeout-minutes: 20
        run: |
          mkdir -p ~/.config && ln -s "$GITHUB_WORKSPACE/nvim-config" ~/.config/nvim
          nvim --headless "+Lazy! update" +qa
      - name: Anything new?
        id: diff
        run: |
          cd nvim-config
          if git diff --quiet -- lazy-lock.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "All plugins already current."
          else echo "changed=true" >> "$GITHUB_OUTPUT"; git diff --stat -- lazy-lock.json; fi
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: updated-lockfile
          path: nvim-config/lazy-lock.json

  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/startup.yml
    with:
      lockfile-artifact: updated-lockfile

  propose:
    name: open a pull request
    needs: [update, check]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: List what moved
        run: git show HEAD:lazy-lock.json > "$RUNNER_TEMP/old-lock.json"
      - uses: actions/download-artifact@v4
        with:
          name: updated-lockfile
          path: .
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RUNNER_TEMP/old-lock.json" lazy-lock.json > "$RUNNER_TEMP/body.md" <<'PY'
          import json, sys
          old, new = (json.load(open(p)) for p in sys.argv[1:3])
          rows = []
          for name in sorted(set(old) | set(new)):
              a, b = old.get(name, {}).get("commit"), new.get(name, {}).get("commit")
              if a != b:
                  rows.append(f"| {name} | {(a or 'new')[:7]} | {(b or 'removed')[:7]} |")
          print("Weekly plugin update. nvim started cleanly with these versions on Linux and macOS")
          print("(startup check, update-plugins run). Merging sends it through check.yml again before")
          print("stable, so the machines only get it after that passes too.\n")
          print("| Plugin | From | To |\n|---|---|---|")
          print("\n".join(rows))
          print("\n🤖 Generated with [Claude Code](https://claude.com/claude-code)")
          PY
          branch=plugins/weekly-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "Plugins: weekly update ($(date -u +%F))"
          git push -f origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else gh pr create --head "$branch" --title "Plugins: weekly update" --body-file "$RUNNER_TEMP/body.md"; fi
