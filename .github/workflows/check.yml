# Start nvim with this config, plugins at the versions in lazy-lock.json, on clean Linux and macOS
# machines; fail on anything you would see at startup (startup.yml, .ci/startup-check.lua). The chezmoi
# machines follow the `stable` branch, which only moves forward when this passes on a push to main.
# Nightly too, which catches changes outside the repo (a new Neovim release, a tool on the runners).
# Plugin updates come from update-plugins.yml as pull requests.
name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  startup:
    uses: ./.github/workflows/startup.yml

  # Move `stable` to this commit once both checks pass. Only forward, so an older run finishing late
  # can't roll it back.
  promote:
    name: promote to stable
    needs: startup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: promote-stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward stable to this commit
        run: |
          git fetch -q origin stable 2>/dev/null || true
          if git rev-parse -q --verify origin/stable >/dev/null && ! git merge-base --is-ancestor origin/stable "$GITHUB_SHA"; then
            echo "stable is not an ancestor of $GITHUB_SHA (a newer commit was already promoted); leaving it"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/stable"
          echo "stable -> $GITHUB_SHA"
